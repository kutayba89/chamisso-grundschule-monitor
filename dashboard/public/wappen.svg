<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120">
  <!-- Shield shape -->
  <path d="M5,5 H95 V75 Q95,115 50,118 Q5,115 5,75 Z" fill="#ffffff" stroke="#8B0000" stroke-width="3"/>
  
  <!-- Left half - black and white checkerboard -->
  <clipPath id="left-half">
    <path d="M5,5 H50 V75 Q50,115 50,118 Q5,115 5,75 Z"/>
  </clipPath>
  <g clip-path="url(#left-half)">
    <!-- Checkerboard pattern -->
    <rect x="5" y="5" width="15" height="15" fill="#1a1a1a"/>
    <rect x="20" y="5" width="15" height="15" fill="#ffffff"/>
    <rect x="35" y="5" width="15" height="15" fill="#1a1a1a"/>
    <rect x="5" y="20" width="15" height="15" fill="#ffffff"/>
    <rect x="20" y="20" width="15" height="15" fill="#1a1a1a"/>
    <rect x="35" y="20" width="15" height="15" fill="#ffffff"/>
    <rect x="5" y="35" width="15" height="15" fill="#1a1a1a"/>
    <rect x="20" y="35" width="15" height="15" fill="#ffffff"/>
    <rect x="35" y="35" width="15" height="15" fill="#1a1a1a"/>
    <rect x="5" y="50" width="15" height="15" fill="#ffffff"/>
    <rect x="20" y="50" width="15" height="15" fill="#1a1a1a"/>
    <rect x="35" y="50" width="15" height="15" fill="#ffffff"/>
    <rect x="5" y="65" width="15" height="15" fill="#1a1a1a"/>
    <rect x="20" y="65" width="15" height="15" fill="#ffffff"/>
    <rect x="35" y="65" width="15" height="15" fill="#1a1a1a"/>
    <rect x="5" y="80" width="15" height="15" fill="#ffffff"/>
    <rect x="20" y="80" width="15" height="15" fill="#1a1a1a"/>
    <rect x="35" y="80" width="15" height="15" fill="#ffffff"/>
    <rect x="5" y="95" width="15" height="20" fill="#1a1a1a"/>
    <rect x="20" y="95" width="15" height="20" fill="#ffffff"/>
    <rect x="35" y="95" width="15" height="20" fill="#1a1a1a"/>
  </g>

  <!-- Right half - green with tree -->
  <clipPath id="right-half">
    <path d="M50,5 H95 V75 Q95,115 50,118 Q50,115 50,75 Z"/>
  </clipPath>
  <g clip-path="url(#right-half)">
    <rect x="50" y="5" width="45" height="113" fill="#2d6a2d"/>
    <!-- Simple tree -->
    <!-- trunk -->
    <rect x="68" y="85" width="8" height="20" fill="#5c3d1e"/>
    <!-- tree layers -->
    <polygon points="72,20 55,60 68,55 58,80 86,80 76,55 89,60" fill="#1a4d1a"/>
    <polygon points="72,15 57,52 70,47 61,70 83,70 74,47 87,52" fill="#2d8a2d"/>
  </g>

  <!-- Dividing line -->
  <line x1="50" y1="5" x2="50" y2="118" stroke="#8B0000" stroke-width="2"/>

  <!-- Shield border -->
  <path d="M5,5 H95 V75 Q95,115 50,118 Q5,115 5,75 Z" fill="none" stroke="#8B0000" stroke-width="3"/>

  <!-- Small red stripe across middle (Reinickendorf detail) -->
  <clipPath id="stripe-clip">
    <path d="M5,5 H95 V75 Q95,115 50,118 Q5,115 5,75 Z"/>
  </clipPath>
  <g clip-path="url(#stripe-clip)">
    <rect x="0" y="55" width="100" height="12" fill="#8B0000" opacity="0.85"/>
    <!-- River/wave detail in stripe -->
    <path d="M5,61 Q15,57 25,61 Q35,65 45,61 Q55,57 65,61 Q75,65 85,61 Q92,58 95,61" fill="none" stroke="#4a9fd4" stroke-width="2.5"/>
  </g>
</svg>